{% extends "base.html" %}

{% block title %}Invasive Trace — HITL Dashboard{% endblock %}

{% block extra_head %}
<style>
    #map { height: 100vh; width: 100%; }
    #sidebar { height: 100vh; overflow-y: auto; }
    .prediction-card { transition: all 0.2s; }
    .prediction-card:hover { box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .location-group { border: 1px solid #e5e7eb; border-radius: 0.5rem; margin-bottom: 1rem; }
    .location-header {
        background-color: #f9fafb;
        padding: 0.75rem 1rem;
        border-bottom: 1px solid #e5e7eb;
        font-weight: 600;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .location-content { padding: 1rem; }
    .duplicate-count {
        background-color: #f3f4f6;
        color: #374151;
        border-radius: 9999px;
        padding: 0.25rem 0.5rem;
        font-size: 0.75rem;
    }
    .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0,0,0,0.5);
    }
    .modal-content {
        background-color: white;
        margin: 15% auto;
        padding: 20px;
        border-radius: 8px;
        width: 80%;
        max-width: 500px;
    }
    .close {
        color: #aaa;
        float: right;
        font-size: 28px;
        font-weight: bold;
        cursor: pointer;
    }
</style>
{% endblock %}

{% block content %}
<div class="flex flex-row h-screen">
    <!-- Map Container -->
    <div class="flex-1 relative">
        <div id="map"></div>
    </div>

    <!-- Sidebar Container -->
    <div id="sidebar" class="w-96 bg-white border-l border-gray-200 p-4">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-bold">Predictions to Review</h2>
            <div class="flex gap-2">
                <button onclick="openBulkUpdateModal()" class="px-3 py-1 bg-blue-600 text-white text-sm rounded hover:bg-blue-700">
                    Bulk Update
                </button>
                <button onclick="openSyncModal()" class="px-3 py-1 bg-green-600 text-white text-sm rounded hover:bg-green-700">
                    Sync ROIs
                </button>
            </div>
        </div>
        <div id="prediction-list" class="space-y-4"
             hx-get="/api/v1/predictions/list"
             hx-trigger="load">
            <p class="text-gray-500">Loading predictions...</p>
        </div>
    </div>
</div>

<!-- Bulk Update Modal -->
<div id="bulkUpdateModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeBulkUpdateModal()">&times;</span>
        <h3 class="text-lg font-bold mb-4">Bulk Update Predictions</h3>
        <form id="bulkUpdateForm" hx-post="/api/v1/predictions/bulk-update"
              hx-target="#prediction-list" hx-swap="innerHTML">
            <div class="mb-4">
                <label class="block text-sm font-medium mb-2">Action</label>
                <select name="action" class="w-full border border-gray-300 rounded px-3 py-2">
                    <option value="confirm">Confirm All Pending</option>
                    <option value="reject">Reject All Pending</option>
                </select>
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium mb-2">ROI Filter (optional)</label>
                <input type="text" name="roi_id" placeholder="Enter ROI UUID"
                       class="w-full border border-gray-300 rounded px-3 py-2">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">
                Apply Bulk Update
            </button>
        </form>
    </div>
</div>

<!-- Sync ROI Modal -->
<div id="syncModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeSyncModal()">&times;</span>
        <h3 class="text-lg font-bold mb-4">Sync ROIs</h3>
        <form id="syncForm" hx-post="/api/v1/rois/sync"
              hx-target="#prediction-list" hx-swap="innerHTML">
            <div class="mb-4">
                <label class="block text-sm font-medium mb-2">ROI IDs (comma-separated)</label>
                <textarea name="roi_ids" placeholder="Enter ROI UUIDs"
                       class="w-full border border-gray-300 rounded px-3 py-2" rows="3"></textarea>
            </div>
            <button type="submit" class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700">
                Sync Selected ROIs
            </button>
        </form>
    </div>
</div>

<script>
    // Initialize Leaflet map
    const map = L.map('map').setView([35.0, -100.0], 6);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    // Function to group predictions by location coordinates
    function groupPredictionsByLocation(predictions) {
        const groups = {};
        
        predictions.forEach(prediction => {
            // Check if geometry and coordinates exist
            if (!prediction.geometry || !prediction.geometry.coordinates || prediction.geometry.coordinates.length < 2) {
                return;
            }
            
            // Use coordinates to group predictions (longitude, latitude)
            const lon = prediction.geometry.coordinates[0];
            const lat = prediction.geometry.coordinates[1];
            
            // Round coordinates to avoid floating point precision issues
            const roundedCoords = `${lon.toFixed(6)},${lat.toFixed(6)}`;
            
            if (!groups[roundedCoords]) {
                groups[roundedCoords] = {
                    coordinates: [lon, lat],
                    predictions: []
                };
            }
            
            groups[roundedCoords].predictions.push(prediction);
        });
        
        return Object.values(groups);
    }

    // Function to create a summary card for a location group
    function createLocationGroupCard(group) {
        // For now, we'll use the first prediction in the group as the representative
        const firstPrediction = group.predictions[0];
        const location = firstPrediction.geometry.coordinates;
        
        // Create a unique ID for this group
        const groupId = `group-${location[0]}-${location[1]}`;
        
        // Create a summary of all predictions at this location
        const duplicateCount = group.predictions.length - 1;
        
        // Get the most confident prediction (or first one if all same)
        const mostConfident = group.predictions.reduce((prev, current) =>
            (prev.properties.confidence > current.properties.confidence) ? prev : current
        );
        
        const validatedBadge = mostConfident.properties.validated === true
            ? '<span class="px-2 py-1 bg-green-100 text-green-800 rounded text-xs">Confirmed</span>'
            : mostConfident.properties.validated === false
            ? '<span class="px-2 py-1 bg-red-100 text-red-800 rounded text-xs">Rejected</span>'
            : '<span class="px-2 py-1 bg-gray-100 text-gray-800 rounded text-xs">Pending</span>';
            
        return `
            <div class="location-group" id="${groupId}">
                <div class="location-header">
                    <span>Location</span>
                    <span class="duplicate-count">${duplicateCount} duplicate${duplicateCount !== 1 ? 's' : ''}</span>
                </div>
                <div class="location-content">
                    <div class="prediction-card bg-white border border-gray-200 rounded-lg p-4 shadow-sm" id="card-${mostConfident.properties.id}">
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="font-semibold text-gray-900">${mostConfident.properties.species_label}</h3>
                            ${validatedBadge}
                        </div>
                        
                        <div class="space-y-1 text-sm text-gray-600 mb-3">
                            <p>Confidence: <span class="font-medium">${mostConfident.properties.confidence.toFixed(2)}</span></p>
                            <p>Hotspot Score: <span class="font-medium">${mostConfident.properties.hotspot_score !== null ? mostConfident.properties.hotspot_score.toFixed(2) : 'N/A'}</span></p>
                            <p>Model: <span class="font-mono text-xs">${mostConfident.properties.model_version}</span></p>
                        </div>
                        
                        <div class="flex gap-2">
                            <button
                                hx-patch="/api/v1/predictions/${mostConfident.properties.id}/validate/html"
                                hx-vals='{"validated": true}'
                                hx-target="#card-${mostConfident.properties.id}"
                                hx-swap="outerHTML"
                                class="flex-1 px-3 py-2 bg-green-600 text-white text-sm font-medium rounded hover:bg-green-700 transition-colors"
                            >
                                Confirm
                            </button>
                            <button
                                hx-patch="/api/v1/predictions/${mostConfident.properties.id}/validate/html"
                                hx-vals='{"validated": false}'
                                hx-target="#card-${mostConfident.properties.id}"
                                hx-swap="outerHTML"
                                class="flex-1 px-3 py-2 bg-red-600 text-white text-sm font-medium rounded hover:bg-red-700 transition-colors"
                            >
                                Reject
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        `;
    }

    // Fetch predictions from GeoJSON endpoint and render markers
    fetch('/api/v1/predictions')
        .then(response => response.json())
        .then(data => {
            if (data.features && data.features.length > 0) {
                // Group predictions by location
                const groupedPredictions = groupPredictionsByLocation(data.features);
                
                // Update the sidebar with grouped predictions
                const sidebar = document.getElementById('prediction-list');
                let htmlContent = '';
                
                groupedPredictions.forEach(group => {
                    htmlContent += createLocationGroupCard(group);
                });
                
                sidebar.innerHTML = htmlContent;
                
                // Render map markers
                L.geoJSON(data, {
                    onEachFeature: function(feature, layer) {
                        const props = feature.properties;
                        const validatedBadge = props.validated === true
                            ? '<span class="px-2 py-1 bg-green-100 text-green-800 rounded text-xs">Confirmed</span>'
                            : props.validated === false
                            ? '<span class="px-2 py-1 bg-red-100 text-red-800 rounded text-xs">Rejected</span>'
                            : '<span class="px-2 py-1 bg-gray-100 text-gray-800 rounded text-xs">Pending</span>';

                        layer.bindPopup(`
                            <div class="p-2">
                                <h3 class="font-bold">${props.species_label}</h3>
                                <p>Confidence: ${props.confidence.toFixed(2)}</p>
                                <p>Hotspot Score: ${props.hotspot_score !== null ? props.hotspot_score.toFixed(2) : 'N/A'}</p>
                                <p>Model: ${props.model_version}</p>
                                ${validatedBadge}
                            </div>
                        `);
                    },
                    pointToLayer: function(feature, latlng) {
                        const props = feature.properties;
                        const color = props.validated === true
                            ? 'green'
                            : props.validated === false
                            ? 'red'
                            : 'blue';

                        return L.circleMarker(latlng, {
                            radius: 8,
                            fillColor: color,
                            color: '#fff',
                            weight: 2,
                            opacity: 1,
                            fillOpacity: 0.8
                        });
                    }
                }).addTo(map);
            } else {
                // No predictions — show empty state
                document.getElementById('prediction-list').innerHTML =
                    '<p class="text-gray-500">No predictions to review</p>';
            }
        })
        .catch(err => {
            console.error('Failed to load predictions:', err);
            document.getElementById('prediction-list').innerHTML =
                '<p class="text-red-500">Failed to load predictions</p>';
        });

    // Modal functions
    function openBulkUpdateModal() {
        document.getElementById('bulkUpdateModal').style.display = 'block';
    }
    
    function closeBulkUpdateModal() {
        document.getElementById('bulkUpdateModal').style.display = 'none';
    }
    
    function openSyncModal() {
        document.getElementById('syncModal').style.display = 'block';
    }
    
    function closeSyncModal() {
        document.getElementById('syncModal').style.display = 'none';
    }
    
    // Close modal when clicking outside
    window.onclick = function(event) {
        const bulkModal = document.getElementById('bulkUpdateModal');
        const syncModal = document.getElementById('syncModal');
        if (event.target == bulkModal) {
            bulkModal.style.display = 'none';
        }
        if (event.target == syncModal) {
            syncModal.style.display = 'none';
        }
    }
</script>
{% endblock %}
