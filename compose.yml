# Invasive Trace — Podman Compose Stack with Load Balancer
# Compatible with: podman compose / podman-compose
# Usage: just start

name: invasive-trace

services:

  # ---------------------------------------------------------------------------
  # Traefik — Load Balancer
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v3.0
    container_name: invasive-trace-traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - backend

  # ---------------------------------------------------------------------------
  # PostGIS 16-3.4 — Spatial database
  # ---------------------------------------------------------------------------
  db:
    image: postgis/postgis:16-3.4
    container_name: invasive-trace-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-invasive_trace}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      # Prevent accidental production runs with default credentials
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./migrations/init:/docker-entrypoint-initdb.d:ro   # optional seed SQL
    ports:
      - "5432:5432"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-invasive_trace}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend

  # ---------------------------------------------------------------------------
  # FastAPI App — Invasive Trace API server (replicated)
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Containerfile
    restart: unless-stopped
    working_dir: /workspace
    command: ["/app/.venv/bin/python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      # Database connection — matches db service above
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-appuser}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-invasive_trace}
      # External API keys — populate via .env file, never commit values
      INAT_API_KEY: ${INAT_API_KEY:-}
      EDDMAPS_API_KEY: ${EDDMAPS_API_KEY:-}
      # Planetary Computer uses the planetary-computer library's token refresh;
      # set PC_SDK_SUBSCRIPTION_KEY if using a registered subscription key.
      PC_SDK_SUBSCRIPTION_KEY: ${PC_SDK_SUBSCRIPTION_KEY:-}
      # Runtime settings
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PYTHONPATH: /workspace
    volumes:
      # Live-reload source mount for development; keep it separate from the packaged runtime
      - .:/workspace:z
      # Persist trained model artifacts across container restarts
      - model_artifacts:/workspace/models
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.invasive-trace.rule=PathPrefix(`/`)"
      - "traefik.http.routers.invasive-trace.entrypoints=web"
      - "traefik.http.services.invasive-trace.loadbalancer.server.port=8000"
    deploy:
      mode: replicated
      replicas: 2
      resources:
        limits:
          cpus: "1"
          memory: 512M

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  db_data:
    driver: local
  model_artifacts:
    driver: local

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  backend:
    driver: bridge
