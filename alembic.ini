# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = migrations

# sys.path path, will be prepended to sys.path if present.
# Defaults to the current working directory.
prepend_sys_path = .

# version path separator; Use os.sep as separator for multiple version locations.
version_path_separator = os

# NOTE: sqlalchemy.url is intentionally left as a placeholder.
# The real value is injected from app/config.py in migrations/env.py.
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
